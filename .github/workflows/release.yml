name: Release CLI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build phaneros and phanerosd
        run: cargo build --release --target ${{ matrix.target }} --bin phaneros --bin phanerosd

      - name: Package archive
        id: package
        run: |
          set -euo pipefail
          archive="phaneros-${{ matrix.target }}.tar.gz"
          staging="target/${{ matrix.target }}/release"
          tar -czf "$archive" -C "$staging" phaneros phanerosd
          shasum -a 256 "$archive" > "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload archive as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true

  update-tap:
    needs: [build, release]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Determine version and checksums
        id: info
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "arm_sha=$(cut -d' ' -f1 dist/phaneros-aarch64-apple-darwin.tar.gz.sha256)" >> "$GITHUB_OUTPUT"
          echo "intel_sha=$(cut -d' ' -f1 dist/phaneros-x86_64-apple-darwin.tar.gz.sha256)" >> "$GITHUB_OUTPUT"

      - name: Checkout tap repo
        uses: actions/checkout@v4
        with:
          repository: asierzapata/homebrew-phaneros
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update formula
        run: |
          cat > tap/Formula/phaneros.rb <<EOF
          class Phaneros < Formula
            desc "Command-line interface for phaneros file synchronization"
            homepage "https://asierzapata.github.io/phaneros/"
            version "${{ steps.info.outputs.version }}"
            license "AGPL-3.0-or-later"

            on_macos do
              on_arm do
                url "https://github.com/asierzapata/phaneros/releases/download/${{ steps.info.outputs.tag }}/phaneros-aarch64-apple-darwin.tar.gz"
                sha256 "${{ steps.info.outputs.arm_sha }}"
              end
              on_intel do
                url "https://github.com/asierzapata/phaneros/releases/download/${{ steps.info.outputs.tag }}/phaneros-x86_64-apple-darwin.tar.gz"
                sha256 "${{ steps.info.outputs.intel_sha }}"
              end
            end

            def install
              bin.install "phaneros"
              bin.install "phanerosd"
            end

            test do
              system "#{bin}/phaneros", "--version"
            end
          end
          EOF

      - name: Commit and push formula update
        run: |
          set -euo pipefail
          cd tap
          git config user.name "phaneros-release-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet; then
            echo "Formula unchanged, nothing to commit."
            exit 0
          fi
          git add Formula/phaneros.rb
          git commit -m "phaneros ${{ steps.info.outputs.version }}"
          git push
