name: phaneros

services:
  phaneros-store:
    image: ${PHANEROS_STORE_IMAGE:-ghcr.io/asierzapata/phaneros-store:latest}
    container_name: phaneros-store
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /data/phaneros.db
      BLOB_STORAGE_PATH: /data/blobs
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      RUST_LOG: ${RUST_LOG:-info,tower_http=debug}
    ports:
      - "8080:3000"
    volumes:
      - phaneros_data:/data

volumes:
  phaneros_data:
