name: phaneros

services:
  phaneros-store:
    image: ${PHANEROS_STORE_IMAGE:-ghcr.io/asierzapata/phaneros-store:latest}
    container_name: phaneros-store
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /data/phaneros.db
      BLOB_STORAGE_PATH: /data/blobs
      PUBLIC_URL: ${PUBLIC_URL:-https://phaneros.asierzapata.com}
      RUST_LOG: ${RUST_LOG:-info,tower_http=debug}
    ports:
      - "${HOST_PORT:-8085}:3000"
    volumes:
      - ${PHANEROS_DATA_DIR:-/mnt/nas/phaneros}:/data

  # Optional Cloudflare Tunnel service for exposing phaneros-store securely to the internet.
  # Set TUNNEL_TOKEN in your environment or .env file to enable.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: phaneros-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
