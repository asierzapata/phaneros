[package]
name = "phaneros-cli"
version = "0.2.1"
description = "Command-line interface for phaneros file synchronization."
repository = "https://github.com/asierzapata/phaneros"
homepage = "https://asierzapata.github.io/phaneros/"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[package.metadata.dist]
dist = true

[[bin]]
name = "phaneros"
path = "src/main.rs"

[[bin]]
name = "phanerosd"
path = "src/bin/phanerosd.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
colored = "3.1.1"
dirs = "6.0.0"
jiff = "0.2.35"
phaneros-daemon = { version = "0.2.1", path = "../phaneros-daemon" }
phaneros-ipc = { version = "0.2.1", path = "../phaneros-ipc" }
serde = "1.0.228"
serde_json = "1.0.145"
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread", "signal"] }
unicode-width = "0.2.2"
