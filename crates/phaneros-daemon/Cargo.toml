[package]
name = "phaneros-daemon"
version = "0.1.0"
description = "Background daemon service for phaneros file synchronization."
repository = "https://github.com/asierzapata/phaneros"
homepage = "https://asierzapata.github.io/phaneros/"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "phanerosd"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
phaneros-core = { version = "0.1.0", path = "../phaneros-core" }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
