[package]
name = "phaneros-daemon"
version = "0.2.1"
description = "Background daemon service for phaneros file synchronization."
repository = "https://github.com/asierzapata/phaneros"
homepage = "https://asierzapata.github.io/phaneros/"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[package.metadata.dist]
dist = false

[lib]
name = "phaneros_daemon"
path = "src/lib.rs"

[[bin]]
name = "phanerosd"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0.0"
futures = "0.3"
phaneros-core = { version = "0.2.1", path = "../phaneros-core" }
phaneros-ipc = { version = "0.2.1", path = "../phaneros-ipc" }
serde_json = "1.0.145"
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
